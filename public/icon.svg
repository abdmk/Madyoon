<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="مديون">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)" />

  <!-- "M" monogram, its two peaks doubling as a money-flow line. -->
  <path
    d="M138 344 L138 182 L256 300 L374 182 L374 344"
    fill="none"
    stroke="#fff"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Coin accent, top-right. -->
  <circle cx="404" cy="138" r="26" fill="#fbbf24" />
  <circle cx="404" cy="138" r="26" fill="none" stroke="#fff" stroke-width="6" opacity="0.35" />
</svg>
